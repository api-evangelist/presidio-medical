aid: presidio-medical
name: Presidio Medical
description: >-
  Presidio Medical is a privately held, clinical-stage medical device company headquartered in
  South San Francisco, California, founded in 2017 by Kenneth Wu and led by CEO and Chairman
  Michael Onuscheck. It is developing an implantable Ultra Low Frequency (ULF) neuromodulation
  platform intended to treat diseases of undesired neural activity, with a first indication in
  chronic nociceptive low back pain. The therapy delivers ultra low frequency current through an
  epidural spinal cord stimulation (SCS) lead to reversibly inhibit pain-signaling neurons via
  sodium channel inactivation, positioned as a non-opioid alternative to conventional SCS. The
  company raised a $72M Series C in 2023 led by Deerfield Management with Invus Opportunities,
  Action Potential Venture Capital and ShangBay Capital, and received FDA IDE approval for the
  global pivotal FULFILL randomized controlled trial in the United States and Australia. Presidio
  Medical sells an implantable medical device, not software; it has never operated a developer
  program, public API, SDK or machine-readable API contract. As of 2026-08-05 its corporate
  WordPress site at presidiomedical.com is offline, returning a WP Engine "Site Not Configured"
  HTTP 404 on every path including the root.
